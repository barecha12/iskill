<svg width="240" height="240" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient for depth -->
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="240" height="240" rx="36" fill="#020617"/>

  <!-- Subtle grid -->
  <g opacity="0.05" stroke="#FACC15" stroke-width="1">
    <path d="M0 60 H240 M0 120 H240 M0 180 H240"/>
    <path d="M60 0 V240 M120 0 V240 M180 0 V240"/>
  </g>

  <!-- Outer orbital ring -->
  <circle cx="120" cy="120" r="82"
          stroke="#FACC15"
          stroke-width="2"
          fill="none"
          opacity="0.25"
          stroke-dasharray="6 10"/>

  <!-- Secondary orbit -->
  <circle cx="120" cy="120" r="60"
          stroke="#FACC15"
          stroke-width="1.5"
          fill="none"
          opacity="0.2"/>

  <!-- Curved data streams -->
  <path d="M60 90 Q120 40 180 90"
        stroke="#FACC15"
        stroke-width="2"
        fill="none"
        opacity="0.6"/>

  <path d="M180 150 Q120 200 60 150"
        stroke="#FACC15"
        stroke-width="2"
        fill="none"
        opacity="0.6"/>

  <!-- Core hub -->
  <circle cx="120" cy="120" r="28" fill="url(#coreGrad)" filter="url(#glow)"/>

  <!-- Inner rings -->
  <circle cx="120" cy="120" r="18" fill="#020617"/>
  <circle cx="120" cy="120" r="10" fill="#FACC15"/>

  <!-- Cross connectors -->
  <g stroke="#FACC15" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="52" x2="120" y2="92"/>
    <line x1="188" y1="120" x2="148" y2="120"/>
    <line x1="120" y1="188" x2="120" y2="148"/>
    <line x1="52" y1="120" x2="92" y2="120"/>
  </g>

  <!-- Nodes with glow -->
  <g fill="#FACC15" filter="url(#glow)">
    <circle cx="120" cy="40" r="7"/>
    <circle cx="200" cy="120" r="7"/>
    <circle cx="120" cy="200" r="7"/>
    <circle cx="40" cy="120" r="7"/>
  </g>

  <!-- Directional arrows -->
  <g fill="#FACC15">
    <path d="M120 32 L126 48 L114 48 Z"/>
    <path d="M208 120 L190 126 L190 114 Z"/>
    <path d="M120 208 L114 190 L126 190 Z"/>
    <path d="M32 120 L48 114 L48 126 Z"/>
  </g>

  <!-- Micro data particles (adds life) -->
  <g fill="#FACC15" opacity="0.6">
    <circle cx="90" cy="80" r="2"/>
    <circle cx="150" cy="80" r="2"/>
    <circle cx="150" cy="160" r="2"/>
    <circle cx="90" cy="160" r="2"/>
  </g>

</svg>